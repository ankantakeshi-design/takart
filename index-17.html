<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3DNJFV6TN0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3DNJFV6TN0');
  </script>
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="en">
  <meta name="description" content="Digital art by Takechan — Dragons, abstract designs, and more.">
  <title>Takechan art gallery</title>
  <link rel="icon" type="image/png" sizes="512x512" href="takart512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="takart192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="takart180.png">
  <meta name="apple-mobile-web-app-title" content="TAKART">
  <meta name="application-name" content="TAKART">
  <meta property="og:title" content="Takechan art gallery">
  <meta property="og:description" content="Takechan art gallery">
  <meta property="og:image" content="https://takart.pages.dev/ogp.png">
  <meta property="og:url" content="https://takart.pages.dev">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://takart.pages.dev/ogp.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      background: #fff;
      color: #000;
      font-family: 'EB Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    header {
      position: fixed;
      top: 36px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #000;
      pointer-events: none;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 40px;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.05em;
      padding: 3px 0;
      position: relative;
      transition: opacity 0.2s;
    }

    nav button::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: #000;
      transition: width 0.3s ease;
    }

    nav button:hover::after { width: 100%; }
    nav button:hover { opacity: 0.45; }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #overlay.active { display: flex; }

    #media-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90vw;
      height: 78vh;
    }

    #media-wrap img,
    #media-wrap video {
      display: block;
      max-width: 88vw;
      max-height: 76vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #overlay-controls {
      position: fixed;
      bottom: 36px;
      left: 0; width: 100%;
      display: flex;
      justify-content: center;
      gap: 48px;
    }

    #overlay-controls button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #000;
      padding: 4px 0;
      position: relative;
      transition: opacity 0.2s;
    }

    #overlay-controls button::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: #000;
      transition: width 0.3s ease;
    }

    #overlay-controls button:hover::after { width: 100%; }
    #overlay-controls button:hover { opacity: 0.45; }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    footer a {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: #000; }

    #overlay-label {
      position: fixed;
      top: 36px; left: 44px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #bbb;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>Takechan art gallery</header>

  <nav>
    <button onclick="openGallery('dragons')">Dragons</button>
    <button onclick="openGallery('others')">Others</button>
    <button onclick="openGallery('designs')">Designs</button>
  </nav>

  <footer>
    <a href="https://sintaichoseijyuku.pages.dev/" target="_blank">▶ Takechan</a>
  </footer>

  <div id="overlay">
    <span id="overlay-label"></span>
    <div id="media-wrap"></div>
    <div id="overlay-controls">
      <button onclick="showMore()">More</button>
      <button onclick="closeOverlay()">Close</button>
    </div>
  </div>

<script>
  // ── ファイルリスト ─────────────────────────────────────────────
  // ファイルを追加するたびにここに足していくだけでOK
  // 存在しないファイルは自動的にスキップされます

  const registry = {
    dragons: [
      ...Array.from({length: 30}, (_, i) => ({ file: `drm${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `drp${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
    others: [
      ...Array.from({length: 30}, (_, i) => ({ file: `otm${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `otp${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
    designs: [
      ...Array.from({length: 30}, (_, i) => ({ file: `dem${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `dep${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
  };

  // ── State ──────────────────────────────────────────────────────
  let currentCategory = null;
  let availableFiles  = [];
  let shownIndexes    = [];
  let checkedCache    = {};

  // ── ファイル存在チェック（実際にロードして確認）───────────────
  function checkFile({ file, type }) {
    return new Promise(resolve => {
      if (type === 'image') {
        const img = new Image();
        img.onload  = () => resolve({ file, type });
        img.onerror = () => resolve(null);
        img.src = file;
      } else {
        const v = document.createElement('video');
        v.onloadedmetadata = () => resolve({ file, type });
        v.onerror = () => resolve(null);
        v.preload = 'metadata';
        v.src = file;
      }
    });
  }

  // ── ギャラリーを開く ──────────────────────────────────────────
  async function openGallery(cat) {
    currentCategory = cat;
    document.getElementById('overlay-label').textContent =
      cat.charAt(0).toUpperCase() + cat.slice(1);
    document.getElementById('media-wrap').innerHTML =
      '<span style="font-size:11px;color:#ccc;letter-spacing:.1em;">loading...</span>';
    document.getElementById('overlay').classList.add('active');

    if (!checkedCache[cat]) {
      const results = await Promise.all(registry[cat].map(checkFile));
      checkedCache[cat] = results.filter(Boolean);
    }

    availableFiles = checkedCache[cat];
    shownIndexes   = [];

    if (availableFiles.length === 0) {
      document.getElementById('media-wrap').innerHTML =
        '<span style="font-size:11px;color:#bbb;letter-spacing:.1em;font-style:italic;">no files yet</span>';
      return;
    }

    showRandom();
  }

  // ── ランダム表示 ──────────────────────────────────────────────
  function showRandom() {
    if (shownIndexes.length >= availableFiles.length) shownIndexes = [];

    const remaining = availableFiles.map((_,i) => i).filter(i => !shownIndexes.includes(i));
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    shownIndexes.push(pick);
    renderMedia(availableFiles[pick]);
  }

  // ── メディアを描画 ────────────────────────────────────────────
  function renderMedia({ file, type }) {
    const wrap = document.getElementById('media-wrap');
    wrap.innerHTML = '';

    if (type === 'video') {
      const v = document.createElement('video');
      v.src = file;
      v.autoplay = true;
      v.loop     = true;
      v.muted    = true;
      v.playsInline = true;
      wrap.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = file;
      img.alt = file;
      wrap.appendChild(img);
    }
  }

  // ── ボタン操作 ────────────────────────────────────────────────
  function showMore() {
    if (availableFiles.length > 0) showRandom();
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('media-wrap').innerHTML = '';
    currentCategory = null;
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeOverlay();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeOverlay();
    if ((e.key === 'ArrowRight' || e.key === ' ') &&
        document.getElementById('overlay').classList.contains('active')) {
      e.preventDefault();
      showMore();
    }
  });
</script>
</body>
</html>
