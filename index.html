<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="en">
  <meta name="description" content="Digital art by Takechan — Dragons, characters, abstract designs, and more.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takechan art gallery</title>
  <link rel="icon" type="image/png" sizes="512x512" href="takart512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="takart192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="takart180.png">
  <meta name="apple-mobile-web-app-title" content="TAKART">
  <meta name="application-name" content="TAKART">
  <meta property="og:title" content="Takechan art gallery">
  <meta property="og:description" content="Digital art by Takechan — Dragons, characters, abstract designs, and more.">
  <meta property="og:image" content="https://takart.pages.dev/ogp.png">
  <meta property="og:url" content="https://takart.pages.dev">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://takart.pages.dev/ogp.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #000;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }

    /* ── メインのブロック：全部まとめて中央に ── */
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      margin-top: 0;
    }

    .site-title {
      font-size: 16px;
      letter-spacing: 0.2em;
      color: #000;
      margin-bottom: 48px;
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.05em;
      padding: 12px 0;
      display: block;
      width: 100%;
      position: relative;
      transition: opacity 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }

    /* 常に薄い短い下線をチラ見えさせる */
    .nav-btn::after {
      content: '';
      position: absolute;
      bottom: 6px; left: 50%;
      transform: translateX(-50%);
      width: 50%; height: 2px;
      background: #999;
      transition: width 0.35s ease, background 0.3s ease;
    }

    .nav-btn:hover::after,
    .nav-btn:focus::after { width: 40%; background: #000; }
    .nav-btn:hover { opacity: 0.55; }
    .nav-btn:active { transform: scale(0.97); opacity: 0.4; }

    /* ヒントテキスト */
    .tap-hint {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #ccc;
      margin-top: 8px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .footer-link {
      margin-top: 112px;
      margin-left: -1em;
      font-size: 15px;
      letter-spacing: 0.14em;
    }

    .footer-link a {
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-link a:hover { color: #000; }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #overlay.active { display: flex; }

    #media-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90vw;
      height: 78vh;
    }

    #media-wrap img,
    #media-wrap video {
      display: block;
      max-width: 88vw;
      max-height: 76vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #overlay-controls {
      position: fixed;
      bottom: 36px;
      left: 0; width: 100%;
      display: flex;
      justify-content: center;
      gap: 48px;
    }

    #save-btn[hidden] { display: none !important; }

    #overlay-controls button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      letter-spacing: 0.14em;
      color: #000;
      padding: 4px 0;
      position: relative;
      transition: opacity 0.2s;
    }

    #overlay-controls button::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: #000;
      transition: width 0.3s ease;
    }

    #overlay-controls button:hover::after { width: 100%; }
    #overlay-controls button:hover { opacity: 0.45; }

    #overlay-label {
      position: fixed;
      top: 36px; left: 44px;
      font-size: 15px;
      letter-spacing: 0.14em;
      color: #bbb;
      font-style: italic;
    }

    #save-btn.saving { opacity: 0.4; pointer-events: none; }

    /* ── 確認モーダル ── */
    #confirm-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #confirm-modal.active { display: flex; }

    #confirm-box {
      background: #fff;
      max-width: 320px;
      width: 86%;
      padding: 28px 24px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    #confirm-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      line-height: 1.7;
      color: #222;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    #confirm-password {
      width: 100%;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    #confirm-password:focus { outline: none; border-color: #000; }

    #confirm-error {
      font-size: 12px;
      color: #c0392b;
      min-height: 16px;
      margin-bottom: 14px;
    }

    #confirm-actions {
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    #confirm-actions button {
      background: none;
      border: 1px solid #000;
      cursor: pointer;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #000;
      padding: 8px 18px;
      transition: opacity 0.2s;
    }
    #confirm-actions button:active { opacity: 0.5; }
    #confirm-actions #confirm-no { border-color: #ccc; color: #888; }
  </style>
</head>
<body>

  <div class="main">
    <div class="site-title">Takechan art gallery</div>
    <button class="nav-btn" onclick="openGallery('dragons')">Dragons</button>
    <button class="nav-btn" onclick="openGallery('others')">Others</button>
    <button class="nav-btn" onclick="openGallery('characters')">Characters</button>
    <button class="nav-btn" onclick="openGallery('designs')">Designs</button>
    <div class="footer-link">
      <a href="https://sintaichoseijyuku.pages.dev/" target="_blank" onclick="sbLog('link_click',{extra_val:'takechan'})">▶ Takechan</a>
    </div>
  </div>

  <div id="overlay">
    <span id="overlay-label"></span>
    <div id="media-wrap"></div>
    <div id="overlay-controls">
      <button id="save-btn" onclick="saveCurrentMedia()" hidden>Save</button>
      <button onclick="showMore()">More</button>
      <button onclick="closeOverlay()">Close</button>
    </div>
  </div>

  <div id="confirm-modal">
    <div id="confirm-box">
      <p id="confirm-text"></p>
      <input type="password" id="confirm-password" placeholder="パスワード" autocomplete="off">
      <p id="confirm-error"></p>
      <div id="confirm-actions">
        <button id="confirm-yes">はい</button>
        <button id="confirm-no">キャンセル</button>
      </div>
    </div>
  </div>

<script>
  // ── Supabase Analytics ──────────────────────────────────────────
  const SB_URL = 'https://itraumqgammtgiouipak.supabase.co';
  const SB_KEY = 'sb_publishable_ySnnol1KpqNs2yBxqkOVHQ_NZP_J8ZN';
  const _pageStart = Date.now();

  // UTMパラメータ取得
  function getUtmSource() {
    try {
      return new URLSearchParams(location.search).get('utm_source') || null;
    } catch(_) { return null; }
  }

  // 流入元判定（UTM優先 → referrer → direct）
  function detectSource() {
    const utm = getUtmSource();
    if (utm) return utm.toLowerCase();           // utm_source がそのまま流入元名に
    const ref = document.referrer || '';
    if (/x\.com|twitter\.com/i.test(ref))    return 'x';
    if (/bsky\.app|bsky\.social/i.test(ref)) return 'bluesky';
    if (/threads\.net/i.test(ref))           return 'threads';
    if (/google/i.test(ref))                 return 'google';
    if (/instagram\.com/i.test(ref))         return 'instagram';
    if (ref) return 'other';
    return 'direct';  // LINE・ブックマーク・直打ち はここに来る
  }

  // 共通ログ送信（fire-and-forget）
  const WORKER_URL = 'https://takart.ankantakeshi.workers.dev';

  async function sbLog(event, extra = {}) {
    try {
      await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event,
          category:  extra.category  ?? null,
          referrer:  extra.referrer  ?? (document.referrer || null),
          lang:      extra.lang      ?? (navigator.language || null),
          filename:  extra.filename  ?? null,
          extra_val: extra.extra_val ?? null,
        })
      });
    } catch(_) {}
  }

  // media_stats upsert（作品ビュー数）
  async function sbMediaView(category, filename) {
    try {
      await fetch(`${SB_URL}/rest/v1/gallery_media_stats`, {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': `Bearer ${SB_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({ category, filename, views: 1 })
      });
      // ※ Supabase側で views = views + 1 にするには RPC or trigger が必要
      // 簡易版：まずinsert、既存なら別途 increment RPC を呼ぶ
      await fetch(`${SB_URL}/rest/v1/rpc/increment_media_view`, {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': `Bearer ${SB_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_category: category, p_filename: filename })
      });
    } catch(_) {}
  }

  // ① page_view（初回）
  (function() {
    const source = detectSource();
    const utm    = getUtmSource();
    // referrer フィールドに UTM があればそれを、なければ document.referrer を記録
    const refVal = utm ? ('utm:' + utm) : (document.referrer || null);
    sbLog('page_view', { referrer: refVal, lang: navigator.language });
    // X/Bluesky/Threads/LINE など既知の流入元は sns_referrer イベントも送る
    const knownSns = ['x','bluesky','threads','line','instagram'];
    if (knownSns.includes(source)) {
      sbLog('sns_referrer', { extra_val: source, lang: navigator.language });
    }
    // 新規訪問者判定（localStorage未セットなら初回訪問）
    const VISIT_KEY = 'takart_visited';
    if (!localStorage.getItem(VISIT_KEY)) {
      localStorage.setItem(VISIT_KEY, '1');
      sbLog('first_visit', { referrer: refVal, lang: navigator.language });
    }
  })();

  // ② stay_duration（離脱時 - カテゴリなしの場合のみ）
  let _staySent = false;
  function sendStayDuration() {
    flushCategoryStay();  // 開いてたカテゴリがあれば送信
    if (_staySent) return;
    if (_lastCategory) return;  // カテゴリ別で送信済みなのでスキップ
    _staySent = true;
    const sec = Math.round((Date.now() - _pageStart) / 1000);
    if (sec < 1) return;
    fetch(`${SB_URL}/rest/v1/gallery_events`, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        event: 'stay_duration',
        extra_val: String(sec),
        referrer: document.referrer || null,
        lang: navigator.language || null,
        category: _lastCategory || null, filename: null
      }),
      keepalive: true
    }).catch(() => {});
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendStayDuration();
  });
  window.addEventListener('pagehide', sendStayDuration);
  // ── /Supabase Analytics ─────────────────────────────────────────

  // ── 期間限定ダウンロード設定 ─────────────────────────────────────
  // この範囲内だけ Save ボタンが表示されます。終了したい日時に合わせて書き換えてください。
  const DOWNLOAD_START = new Date('2026-06-20T00:00:00+09:00');
  const DOWNLOAD_END   = new Date('2026-06-22T00:00:00+09:00'); // 今日から2日間（6/20・6/21）

  const DAILY_LIMIT = 1; // 1日あたりの保存上限（同じ端末・同じブラウザ内）
  const LS_KEY = 'takart_save_count';

  function isDownloadOpen() {
    const now = new Date();
    return now >= DOWNLOAD_START && now < DOWNLOAD_END;
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function getSaveCountToday() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      return raw.date === todayKey() ? (raw.count || 0) : 0;
    } catch (_) { return 0; }
  }

  function incrementSaveCount() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ date: todayKey(), count: getSaveCountToday() + 1 }));
    } catch (_) {}
  }

  function remainingSavesToday() {
    return Math.max(0, DAILY_LIMIT - getSaveCountToday());
  }

  let currentMediaFile = null;

  function updateSaveButtonVisibility() {
    const btn = document.getElementById('save-btn');
    if (!btn) return;
    if (!isDownloadOpen()) {
      btn.hidden = true;
      return;
    }
    btn.hidden = false;
    const remaining = remainingSavesToday();
    if (remaining <= 0) {
      btn.textContent = 'Save (本日分は終了)';
      btn.disabled = true;
      btn.classList.add('saving');
    } else {
      btn.textContent = `Save (${remaining}/${DAILY_LIMIT})`;
      btn.disabled = false;
      btn.classList.remove('saving');
    }
  }

  const SAVE_PASSWORD = 'Hado';

  function saveCurrentMedia() {
    if (!currentMediaFile || !isDownloadOpen()) return;
    if (remainingSavesToday() <= 0) return; // 1日の上限に達している
    document.getElementById('confirm-text').textContent =
      '本当にダウンロードしますか？\nOKすると本日のダウンロード回数が消費されるのでご注意ください。';
    document.getElementById('confirm-password').value = '';
    document.getElementById('confirm-error').textContent = '';
    document.getElementById('confirm-modal').classList.add('active');
    setTimeout(() => document.getElementById('confirm-password').focus(), 50);
  }

  // 「はい」ボタンのクリック自体がユーザー操作の起点になるよう、
  // ここから直接ダウンロード処理を呼ぶ（iOS Safariでの活性化切れ対策）
  document.getElementById('confirm-yes').addEventListener('click', async function() {
    const pwInput = document.getElementById('confirm-password');
    const errEl = document.getElementById('confirm-error');
    if (pwInput.value !== SAVE_PASSWORD) {
      errEl.textContent = 'パスワードが違います';
      pwInput.value = '';
      pwInput.focus();
      return; // モーダルは閉じない、もう一度入力させる
    }
    document.getElementById('confirm-modal').classList.remove('active');
    if (!currentMediaFile || !isDownloadOpen() || remainingSavesToday() <= 0) return;
    const btn = document.getElementById('save-btn');
    btn.classList.add('saving');
    try {
      const res = await fetch(currentMediaFile);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentMediaFile.split('/').pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      incrementSaveCount();
      sbLog('save_click', { category: currentCategory, filename: currentMediaFile, extra_val: currentMediaFile });
    } catch (e) {
      // フェッチに失敗したら新しいタブで開く（手動の長押し保存にフォールバック）
      window.open(currentMediaFile, '_blank');
    } finally {
      updateSaveButtonVisibility();
    }
  });

  document.getElementById('confirm-no').addEventListener('click', function() {
    document.getElementById('confirm-modal').classList.remove('active');
  });
  // ── /期間限定ダウンロード設定 ────────────────────────────────────

  const registry = {
    dragons: [
      ...Array.from({length: 30}, (_, i) => ({ file: `drm${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `drp${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
    others: [
      ...Array.from({length: 30}, (_, i) => ({ file: `otm${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `otp${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
    characters: [
      ...Array.from({length: 30}, (_, i) => ({ file: `chm${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `chp${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
    designs: [
      ...Array.from({length: 30}, (_, i) => ({ file: `dem${String(i+1).padStart(2,'0')}.mp4`, type: 'video' })),
      ...Array.from({length: 30}, (_, i) => ({ file: `dep${String(i+1).padStart(2,'0')}.png`,  type: 'image' })),
    ],
  };

  let currentCategory = null;
  let _lastCategory = null;  // 離脱時用に最後のカテゴリを保持
  let _catStartTime = null;  // カテゴリ開いた時刻

  // カテゴリ滞在時間を送信
  function flushCategoryStay() {
    if (_lastCategory && _catStartTime) {
      const sec = Math.round((Date.now() - _catStartTime) / 1000);
      if (sec >= 1) {
        fetch(`${SB_URL}/rest/v1/gallery_events`, {
          method: 'POST',
          headers: {
            'apikey': SB_KEY,
            'Authorization': `Bearer ${SB_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            event: 'stay_duration',
            extra_val: String(sec),
            referrer: document.referrer || null,
            lang: navigator.language || null,
            category: _lastCategory, filename: null
          }),
          keepalive: true
        }).catch(() => {});
      }
    }
    _catStartTime = null;
  }
  let availableFiles  = [];
  let shownIndexes    = [];
  let checkedCache    = {};

  function checkFile({ file, type }) {
    return new Promise(resolve => {
      if (type === 'image') {
        const img = new Image();
        img.onload  = () => resolve({ file, type });
        img.onerror = () => resolve(null);
        img.src = file;
      } else {
        const v = document.createElement('video');
        const timer = setTimeout(() => resolve(null), 8000); // 8秒タイムアウト
        v.onloadedmetadata = () => { clearTimeout(timer); resolve({ file, type }); };
        v.onerror = () => { clearTimeout(timer); resolve(null); };
        v.preload = 'metadata';
        v.src = file;
      }
    });
  }

  async function openGallery(cat) {
    flushCategoryStay();  // 前のカテゴリの滞在時間を送信
    currentCategory = cat;
    _lastCategory = cat;
    _catStartTime = Date.now();  // 新カテゴリの開始時刻
    sbLog('category_click', { category: cat }); // ③ category_click
    document.getElementById('overlay-label').textContent =
      cat.charAt(0).toUpperCase() + cat.slice(1);
    document.getElementById('media-wrap').innerHTML =
      '<span style="font-size:12px;color:#ccc;letter-spacing:.1em;">loading...</span>';
    document.getElementById('overlay').classList.add('active');
    updateSaveButtonVisibility();

    if (!checkedCache[cat]) {
      const results = await Promise.all(registry[cat].map(checkFile));
      checkedCache[cat] = results.filter(Boolean);
    }

    availableFiles = checkedCache[cat];
    shownIndexes   = [];

    if (availableFiles.length === 0) {
      document.getElementById('media-wrap').innerHTML =
        '<span style="font-size:12px;color:#bbb;letter-spacing:.1em;font-style:italic;">no files yet</span>';
      return;
    }

    showRandom();
  }

  function showRandom() {
    if (!availableFiles || availableFiles.length === 0) return;
    if (shownIndexes.length >= availableFiles.length) shownIndexes = [];
    const remaining = availableFiles.map((_,i) => i).filter(i => !shownIndexes.includes(i));
    if (remaining.length === 0) { shownIndexes = []; return showRandom(); }
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    shownIndexes.push(pick);
    renderMedia(availableFiles[pick]);
  }

  function renderMedia({ file, type }) {
    const wrap = document.getElementById('media-wrap');
    wrap.innerHTML = '';
    currentMediaFile = file;
    updateSaveButtonVisibility();
    // ④ media_view
    sbLog('media_view', { category: currentCategory, filename: file, extra_val: file });
    sbMediaView(currentCategory, file);
    if (type === 'video') {
      const v = document.createElement('video');
      v.src = file;
      v.autoplay = true;
      v.loop     = true;
      v.muted    = true;
      v.playsInline = true;
      // エラーが出ても次の作品に進むだけ、オーバーレイは閉じない
      v.onerror = () => { if (availableFiles.length > 1) showRandom(); };
      wrap.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = file;
      img.alt = file;
      // エラーが出ても次の作品に進むだけ
      img.onerror = () => { if (availableFiles.length > 1) showRandom(); };
      wrap.appendChild(img);
    }
  }

  function showMore() {
    if (availableFiles.length > 0) {
      sbLog('more_click', { category: currentCategory }); // ⑤ more_click
      showRandom();
    }
  }

  function closeOverlay() {
    flushCategoryStay();  // カテゴリ滞在時間を送信
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('media-wrap').innerHTML = '';
    currentCategory = null;
    currentMediaFile = null;
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeOverlay();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeOverlay();
    if ((e.key === 'ArrowRight' || e.key === ' ') &&
        document.getElementById('overlay').classList.contains('active')) {
      e.preventDefault();
      showMore();
    }
  });
</script>
</body>
</html>
